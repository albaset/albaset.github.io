<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F7F8FB;
    --panel:#FFFFFF;
    --panel-2:#F2F4F8;
    --border:#E6E9F0;
    --blue:#2555E7;
    --blue-dark:#1B3FB8;
    --blue-tint:#EEF2FF;
    --text:#0F1524;
    --text-dim:#5B6472;
    --text-dimmer:#9399A6;
    --heading:'Plus Jakarta Sans', sans-serif;
    --body:'Inter', sans-serif;
    --maxw:1120px;
    --radius:18px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  img{max-width:100%; display:block;}
  svg{display:block;}

  /* Dark navy surface used for hero + footer, reusing all shared component
     styles by overriding the same CSS variables locally */
  .dark-surface{
    background:var(--dark-bg, #0A1424);
    --panel:var(--dark-panel, #111E33);
    --panel-2:var(--dark-panel-2, #152943);
    --border:var(--dark-border, #233A57);
    --text:#F4F7FC;
    --text-dim:#9FB0C9;
    --text-dimmer:#6C7F9C;
    --blue-tint:var(--blue-tint-dark, rgba(69,140,255,0.16));
    color:var(--text);
  }
  .dark-surface::selection{background:var(--blue);}

  /* Gentle alternating tint for readability rhythm between sections */
  section:nth-of-type(even){background:var(--bg-soft);}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  .eyebrow{
    font-family:var(--heading); font-size:0.82rem; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase; color:var(--blue); margin-bottom:10px;
  }

  h1,h2,h3{font-family:var(--heading); color:var(--text);}

  .reveal{opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal.in{opacity:1; transform:none;}

  /* NAV */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{
    max-width:var(--maxw); margin:0 auto; padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-brand{font-family:var(--heading); font-size:1.1rem; font-weight:800; letter-spacing:-0.01em;}
  .nav-brand span{color:var(--blue);}
  .nav-links{display:flex; gap:24px;}
  .nav-links a{
    font-size:0.88rem; font-weight:500; color:var(--text-dim);
    position:relative; padding-bottom:4px; transition:color 0.2s ease; white-space:nowrap;
  }
  .nav-links a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:2px;
    background:var(--blue); transition:width 0.2s ease;
  }
  .nav-links a:hover{color:var(--text);}
  .nav-links a.active{color:var(--text);}
  .nav-links a.active::after{width:100%;}
  .nav-cta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--blue); color:#fff; font-weight:600; font-size:0.84rem;
    padding:10px 18px; border-radius:9px;
    transition:transform 0.2s ease, background 0.2s ease; flex-shrink:0;
  }
  .nav-cta:hover{background:var(--blue-dark); transform:translateY(-1px);}
  .nav-toggle{
    display:none; background:none; border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:9px; align-items:center; justify-content:center;
  }
  .nav-toggle svg{width:18px; height:18px;}

  @media (max-width:1000px){
    .nav-links{
      position:absolute; top:100%; left:0; right:0;
      background:#fff; flex-direction:column; gap:0;
      display:none; border-bottom:1px solid var(--border); padding:6px 0;
      box-shadow:0 12px 24px -12px rgba(15,21,36,0.15);
    }
    .nav-links.open{display:flex;}
    .nav-links a{padding:14px 24px; width:100%;}
    .nav-toggle{display:flex;}
    .nav-cta{display:none;}
  }

  /* HERO */
  header.hero{padding:120px 0 64px;}
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:48px; align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr; gap:36px;}}

  .hero-badge{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.78rem; font-weight:600; color:var(--blue);
    background:var(--blue-tint); border:1px solid var(--border);
    padding:7px 14px; border-radius:99px; margin-bottom:20px;
  }
  .hero-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--blue);}

  .hero h1.name{
    font-size:clamp(2.2rem, 6.5vw, 3.6rem); font-weight:800; line-height:1.08;
    letter-spacing:-0.02em; margin-bottom:8px;
  }
  .hero .role{
    font-family:var(--heading); font-weight:700; font-size:clamp(1.05rem, 2.6vw, 1.35rem);
    color:var(--blue); margin-bottom:18px;
  }
  .hero .desc{color:var(--text-dim); max-width:54ch; margin-bottom:18px; font-size:1rem;}
  .hero .locline{display:flex; align-items:center; gap:8px; color:var(--text-dimmer); font-size:0.88rem; margin-bottom:28px;}
  .hero .locline svg{width:15px; height:15px; color:var(--blue); flex-shrink:0;}

  .hero-cta{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:26px;}
  .btn{
    font-family:var(--body); font-weight:600; font-size:0.88rem; padding:13px 24px; border-radius:10px;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn.solid{background:var(--blue); color:#fff;}
  .btn.solid:hover{background:var(--blue-dark); transform:translateY(-1px);}
  .btn.outline{border:1px solid var(--border); color:var(--text); background:var(--panel);}
  .btn.outline:hover{border-color:var(--blue); color:var(--blue);}

  .social-row{display:flex; gap:10px;}
  .social-row a{
    width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); transition:all 0.2s ease;
  }
  .social-row a:hover{color:var(--blue); border-color:var(--blue); background:var(--blue-tint);}
  .social-row svg{width:17px; height:17px;}
  .social-row .icon-letter{font-family:var(--heading); font-weight:800; font-size:0.92rem; line-height:1;}

  .hero-photo-block{display:flex; flex-direction:column; gap:12px;}
  .hero-photo{
    border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);
    aspect-ratio:3/3.5; background:var(--panel-2);
    box-shadow:0 24px 48px -24px rgba(15,21,36,0.2);
    display:flex; align-items:center; justify-content:center;
  }
  .hero-photo img{width:100%; height:100%; object-fit:cover;}
  .ph-placeholder{text-align:center; color:var(--text-dimmer); font-size:0.76rem; padding:20px; line-height:1.7;}
  .ph-placeholder b{display:block; color:var(--blue); font-family:var(--heading); font-size:0.88rem; margin-bottom:6px;}
  .photo-caption{text-align:center; font-size:0.74rem; letter-spacing:0.03em; color:var(--text-dimmer); font-weight:600;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:44px;}
  @media (max-width:640px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat-card{
    position:relative; overflow:hidden;
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px 16px;
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .stat-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--accent, var(--blue)); transform:scaleX(0); transform-origin:left;
    transition:transform 0.3s ease;
  }
  .stat-card:hover{transform:translateY(-4px); border-color:var(--accent, var(--blue)); box-shadow:0 14px 26px -16px rgba(15,21,36,0.2);}
  .stat-card:hover::before{transform:scaleX(1);}
  .stat-card.c-blue{--accent:#2555E7;}
  .stat-card.c-violet{--accent:#7C5CFC;}
  .stat-card.c-amber{--accent:#E08A1E;}
  .stat-card.c-green{--accent:#1FA971;}
  .stat-card .icon{
    width:36px; height:36px; border-radius:10px; background:var(--blue-tint); color:var(--accent, var(--blue));
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
    transition:transform 0.25s ease;
  }
  .stat-card:hover .icon{transform:scale(1.08);}
  .stat-card .icon svg{width:19px; height:19px;}
  .stat-card .title{font-family:var(--heading); font-weight:700; font-size:0.94rem; margin-bottom:3px;}
  .stat-card .sub{color:var(--text-dim); font-size:0.8rem; line-height:1.4;}

  /* SECTION SHELL */
  section{padding:80px 0; border-top:1px solid var(--border);}
  .section-head{margin-bottom:38px;}
  .section-head h2{font-size:clamp(1.5rem, 3.4vw, 2.05rem); font-weight:800; letter-spacing:-0.01em;}
  .section-lede{color:var(--text-dim); max-width:60ch; margin-top:8px; font-size:0.95rem;}

  /* ABOUT */
  .about-grid{display:grid; grid-template-columns:1fr 0.85fr; gap:44px; align-items:start;}
  @media (max-width:880px){.about-grid{grid-template-columns:1fr;}}
  .about-text p{color:var(--text-dim); margin-bottom:15px; max-width:60ch; font-size:0.96rem;}
  .about-text strong{color:var(--text);}
  .about-photo{
    border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);
    aspect-ratio:4/3.2; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
  }
  .about-photo img{width:100%; height:100%; object-fit:cover;}

  .about-panel-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:480px){.about-panel-row{grid-template-columns:1fr;}}
  .about-panel{background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:20px 22px;}
  .about-panel .k{font-size:0.7rem; color:var(--blue); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:10px;}
  .tag-list{display:flex; flex-wrap:wrap; gap:8px;}
  .tag{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:0.8rem; color:var(--text-dim);}
  .quote-block{
    border-left:3px solid var(--blue); padding-left:16px; margin-top:14px;
    color:var(--text-dim); font-size:0.86rem; font-style:italic; line-height:1.6;
  }
  .info-chip-row{display:flex; flex-wrap:wrap; gap:28px;}
  .info-chip .v{font-weight:600; font-size:0.9rem;}
  .info-chip .sub{color:var(--text-dim); font-size:0.8rem;}

  /* EDUCATION */
  .edu-list{display:flex; flex-direction:column; gap:14px;}
  .edu-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px 22px;
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .edu-card .main{font-weight:700; font-size:0.98rem;}
  .edu-card .sub{color:var(--text-dim); font-size:0.86rem; margin-top:4px;}
  .edu-card .meta{text-align:right; font-size:0.84rem; color:var(--blue); font-weight:600; white-space:nowrap;}
  .edu-card .meta .period{display:block; color:var(--text-dimmer); font-weight:400; font-size:0.76rem; margin-top:3px;}

  /* PHOTO GALLERY */
  .gallery-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.gallery-2{grid-template-columns:1fr;}}
  .gallery-2 .g-item{
    border-radius:12px; overflow:hidden; border:1px solid var(--border);
    aspect-ratio:4/3; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
  }
  .gallery-2 .g-item img{width:100%; height:100%; object-fit:cover;}
  .g-placeholder{text-align:center; color:var(--text-dimmer); font-size:0.72rem; padding:14px; line-height:1.6;}
  .g-placeholder b{display:block; color:var(--blue); font-family:var(--heading); font-size:0.8rem; margin-bottom:4px;}
  .gallery-caption{text-align:center; font-size:0.78rem; color:var(--text-dimmer); margin-top:12px; font-style:italic;}

  /* THESIS PANEL */
  .abstract-panel{background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:28px 30px; margin-bottom:24px;}
  .abstract-panel h3{font-size:1.12rem; font-weight:700; margin-bottom:14px; line-height:1.4;}
  .abstract-panel ul{margin:14px 0;}
  .abstract-panel li{padding-left:20px; position:relative; margin-bottom:8px; color:var(--text-dim); font-size:0.92rem;}
  .abstract-panel li::before{content:"→"; position:absolute; left:0; color:var(--blue);}
  .meta-row{display:flex; flex-wrap:wrap; gap:24px; margin-top:20px; padding-top:18px; border-top:1px solid var(--border);}
  .meta-row .k{color:var(--text-dimmer); text-transform:uppercase; letter-spacing:0.04em; font-size:0.68rem; display:block; margin-bottom:4px;}
  .meta-row .v{font-weight:600; font-size:0.88rem;}

  /* INDUSTRIAL EXPERIENCE */
  .exp-main{background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:28px 30px; margin-bottom:28px;}
  .exp-main .head{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:4px;}
  .exp-main .site{font-weight:700; font-size:1.02rem;}
  .exp-main .date{font-size:0.78rem; color:var(--blue); font-weight:600; white-space:nowrap;}
  .exp-main .pos{color:var(--text-dim); font-size:0.85rem; margin-bottom:14px; display:block; font-style:italic;}
  .exp-main ul{padding-left:20px; color:var(--text-dim); font-size:0.9rem; margin-bottom:22px;}
  .exp-main li{margin-bottom:6px;}

  .visit-subhead{font-size:0.82rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:16px;}
  .visit-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:760px){.visit-grid{grid-template-columns:1fr;}}
  .visit-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px 24px;}
  .visit-card .site{font-weight:700; font-size:0.96rem; margin-bottom:3px;}
  .visit-card .date{font-size:0.76rem; color:var(--blue); font-weight:600; margin-bottom:10px; display:block;}
  .visit-card p{color:var(--text-dim); font-size:0.86rem; margin-bottom:14px;}
  .visit-card .gallery-2{gap:10px;}

  /* SKILLS */
  .skill-groups{display:grid; grid-template-columns:repeat(2,1fr); gap:30px 40px;}
  @media (max-width:640px){.skill-groups{grid-template-columns:1fr;}}
  .skill-group h3{font-size:0.88rem; font-weight:700; color:var(--blue); margin-bottom:14px;}

  /* PROJECTS */
  .proj-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:720px){.proj-grid{grid-template-columns:1fr;}}
  .proj-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .proj-render{
    aspect-ratio:16/10; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; color:var(--text-dimmer);
    font-size:0.76rem; text-align:center; padding:18px; line-height:1.6; overflow:hidden;
  }
  .proj-render img{width:100%; height:100%; object-fit:cover;}
  .proj-render b{display:block; color:var(--blue); font-family:var(--heading); margin-bottom:6px;}
  .proj-body{padding:22px 24px;}
  .proj-body h3{font-size:1.02rem; font-weight:700; margin-bottom:10px;}
  .proj-body ul{color:var(--text-dim); padding-left:18px; font-size:0.88rem;}
  .proj-body li{margin-bottom:5px;}
  .proj-tag{font-size:0.7rem; font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px; display:block;}

  /* CERTIFICATES */
  .cert-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:18px;}
  .cert-tile{background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .cert-tile .img-slot{
    aspect-ratio:4/3; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--text-dimmer); font-size:0.68rem; text-align:center; padding:12px; line-height:1.6;
  }
  .cert-tile .img-slot b{display:block; color:var(--blue); font-family:var(--heading); margin-bottom:4px;}
  .cert-tile .img-slot img{width:100%; height:100%; object-fit:cover;}
  .cert-tile .cap{padding:13px 15px;}
  .cert-tile .cap .title{font-weight:700; font-size:0.84rem; margin-bottom:3px;}
  .cert-tile .cap .issuer{font-size:0.7rem; color:var(--text-dim);}

  /* AWARDS / ACTIVITIES */
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:40px;}
  @media (max-width:720px){.two-col{grid-template-columns:1fr;}}
  .simple-list li{padding:16px 0; border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:flex-start;}
  .simple-list li:first-child{padding-top:0;}
  .simple-list li:last-child{border-bottom:none;}
  .simple-list .mark{
    font-weight:700; color:var(--blue); font-size:0.76rem; flex-shrink:0;
    background:var(--blue-tint); border-radius:8px; padding:5px 10px; white-space:nowrap;
  }
  .simple-list .txt strong{display:block; margin-bottom:3px; font-size:0.92rem;}
  .simple-list .txt span{display:block; color:var(--text-dim); font-size:0.84rem;}
  .simple-list .txt .desc{margin-top:4px; color:var(--text-dimmer); font-size:0.82rem; line-height:1.5;}

  /* FOOTER / CONTACT */
  footer{padding:70px 0 40px; border-top:1px solid var(--border); background:var(--bg-soft);}
  .footer-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; margin-bottom:44px;}
  @media (max-width:720px){.footer-grid{grid-template-columns:1fr;}}
  .contact-links{display:flex; flex-direction:column; gap:12px; margin-top:22px;}
  .contact-links a{
    display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--border);
    border-radius:12px; background:var(--panel); font-size:0.9rem;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .contact-links a svg{width:17px; height:17px; color:var(--blue); flex-shrink:0;}
  .contact-links a:hover{border-color:var(--blue);}
  .footer-panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:24px;}
  .footer-panel .row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); font-size:0.86rem;}
  .footer-panel .row:last-child{border-bottom:none;}
  .footer-panel .row .k{color:var(--text-dimmer);}
  .footer-panel .row .v{font-weight:600;}
  .foot-bottom{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:0.76rem; color:var(--text-dimmer); padding-top:22px; border-top:1px solid var(--border);
  }

  /* CUSTOM SECTIONS */
  .custom-section.has-bg{background-size:cover; background-position:center; background-repeat:no-repeat;}
  .cb-text{color:var(--text-dim); margin-bottom:15px; max-width:65ch; font-size:0.96rem;}
  .cb-list{padding-left:20px; color:var(--text-dim); font-size:0.94rem; margin-bottom:15px;}
  .cb-list li{margin-bottom:8px;}
  .cb-cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:18px; margin-bottom:15px;}
  .cb-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .cb-card-media{
    aspect-ratio:4/3; background:var(--panel-2); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dimmer); font-size:0.68rem; text-align:center; padding:12px; line-height:1.6;
  }
  .cb-card-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .cb-card-media b{display:block; color:var(--blue); font-family:var(--heading); margin-bottom:4px;}
  .cb-card-body{padding:16px 18px;}
  .cb-card-body h3{font-size:0.98rem; font-weight:700; margin-bottom:4px;}
  .cb-card-sub{font-size:0.78rem; color:var(--blue); font-weight:600; margin-bottom:8px;}
  .cb-card-body p{color:var(--text-dim); font-size:0.86rem;}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-brand" id="navBrand"></div>

<script>
(function(){

  const ICONS = {
    education: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>',
    research: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v5.5L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9.5V3"/></svg>',
    design: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.6.7 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
    goal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
    briefcase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7z"/></svg>'
  };

  const SOCIAL = {
    linkedin: (v)=>`<a href="${v}" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg></a>`,
    email: (v)=>`<a href="mailto:${v}" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 6l8 7 8-7"/></svg></a>`,
    github: (v)=>`<a href="${v}" target="_blank" rel="noopener" aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.04-.01-1.89-2.78.62-3.37-1.21-3.37-1.21-.46-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05a9.29 9.29 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.35 4.8-4.58 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .28.18.61.69.5A10.03 10.03 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg></a>`,
    website: (v)=>`<a href="${v}" target="_blank" rel="noopener" aria-label="Website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></svg></a>`,
    researchgate: (v)=>`<a href="${v}" target="_blank" rel="noopener" aria-label="ResearchGate"><span class="icon-letter">R</span></a>`
  };

  function imgBlock(src, alt, placeholderClass, title, hint){
    const ph = `<div class="${placeholderClass}"${src ? ' style="display:none"' : ''}><b>${title}</b>${hint || ''}</div>`;
    if(!src) return ph;
    return `<img src="${src}" alt="${alt||''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">${ph}`;
  }

  function el(id){ return document.getElementById(id); }

  function heading(sectionHeadings, key, defaults){
    const sh = (sectionHeadings && sectionHeadings[key]) || {};
    return {
      eyebrow: sh.eyebrow !== undefined ? sh.eyebrow : defaults.eyebrow,
      title: sh.title !== undefined ? sh.title : defaults.title,
      lede: sh.lede !== undefined ? sh.lede : defaults.lede
    };
  }

  function hexToRgb(hex){
    hex = (hex || '').replace('#','');
    if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
    const num = parseInt(hex, 16) || 0;
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function rgbToHex(r,g,b){
    const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0');
    return '#' + c(r) + c(g) + c(b);
  }
  function shade(hex, amount){
    const {r,g,b} = hexToRgb(hex);
    return rgbToHex(r*(1-amount), g*(1-amount), b*(1-amount));
  }
  function tint(hex, amount){
    const {r,g,b} = hexToRgb(hex);
    return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount);
  }
  function rgbaStr(hex, alpha){
    const {r,g,b} = hexToRgb(hex);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function applyTheme(theme){
    theme = theme || {};
    const accent = theme.accent || '#2555E7';
    const dark = theme.dark || '#0A1424';
    const root = document.documentElement.style;
    root.setProperty('--blue', accent);
    root.setProperty('--blue-dark', shade(accent, 0.22));
    root.setProperty('--blue-tint', tint(accent, 0.92));
    root.setProperty('--blue-tint-dark', rgbaStr(accent, 0.16));
    root.setProperty('--dark-bg', dark);
    root.setProperty('--dark-panel', tint(dark, 0.07));
    root.setProperty('--dark-panel-2', tint(dark, 0.13));
    root.setProperty('--dark-border', tint(dark, 0.24));
  }

  fetch('data.json', {cache:'no-store'})
    .then(r => r.json())
    .then(render)
    .catch(err => {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="padding:20px;background:#fee;color:#900;font-family:sans-serif;">Could not load data.json — ' + err + '</div>');
    });

  function render(data){
    applyTheme(data.theme);

    // Meta
    if(data.meta){
      document.title = data.meta.title || 'Portfolio';
      const m = document.querySelector('meta[name="description"]');
      if(m) m.setAttribute('content', data.meta.description || '');
      el('navBrand').innerHTML = `${data.meta.brandFirst||''}<span> ${data.meta.brandLast||''}</span>`;
    }

    // Nav CTA / CV
    const cv = (data.hero && data.hero.cvFile) || 'CV.pdf';
    el('navCta').href = cv;
    el('heroCvBtn').href = cv;

    // Hero
    const h = data.hero || {};
    el('heroBadge').textContent = h.badge || '';
    el('heroName').textContent = h.name || '';
    el('heroRole').textContent = h.role || '';
    el('heroDesc').textContent = h.description || '';
    el('heroLocation').textContent = h.location || '';
    el('heroCtaBtn').textContent = h.ctaLabel || 'Contact me';
    el('heroPhoto').innerHTML = imgBlock(h.photo, h.name, 'ph-placeholder', 'Your photo', 'Add a photo from the admin page');
    el('heroPhotoCaption').textContent = h.photoCaption || '';

    // Social
    const s = data.social || {};
    let socialHtml = '';
    Object.keys(SOCIAL).forEach(key => {
      if(s[key]) socialHtml += SOCIAL[key](s[key]);
    });
    el('heroSocial').innerHTML = socialHtml;

    // Stats
    el('statRow').innerHTML = (data.stats || []).map(st => `
      <div class="stat-card c-${st.color || 'blue'}">
        <div class="icon">${ICONS[st.icon] || ICONS.star}</div>
        <div class="title">${st.title || ''}</div>
        <div class="sub">${st.sub || ''}</div>
      </div>`).join('');

    // Section headings
    const sh = data.sectionHeadings;
    const hAbout = heading(sh, 'about', {eyebrow:'About', title:'Who I Am'});
    el('aboutEyebrow').textContent = hAbout.eyebrow;
    el('aboutTitle').textContent = hAbout.title;
    const hEdu = heading(sh, 'education', {eyebrow:'Academic Credentials', title:'Education'});
    el('eduEyebrow').textContent = hEdu.eyebrow;
    el('eduTitle').textContent = hEdu.title;
    const hResearch = heading(sh, 'research', {eyebrow:'Research & Thesis', title:'Undergraduate Research'});
    el('researchEyebrow').textContent = hResearch.eyebrow;
    el('researchTitle').textContent = hResearch.title;
    const hExp = heading(sh, 'experience', {eyebrow:'Industry', title:'Industrial Experience & Visits'});
    el('expEyebrow').textContent = hExp.eyebrow;
    el('expTitle').textContent = hExp.title;
    const hSkills = heading(sh, 'skills', {eyebrow:'Capabilities', title:'Technical Skills'});
    el('skillsEyebrow').textContent = hSkills.eyebrow;
    el('skillsTitle').textContent = hSkills.title;
    const hProj = heading(sh, 'projects', {eyebrow:'Design Work', title:'Projects'});
    el('projEyebrow').textContent = hProj.eyebrow;
    el('projTitle').textContent = hProj.title;
    const hCert = heading(sh, 'certificates', {eyebrow:'Credentials', title:'Certificates & Achievements', lede:'Professional trainings, workshops and academic recognitions.'});
    el('certEyebrow').textContent = hCert.eyebrow;
    el('certTitle').textContent = hCert.title;
    el('certLede').textContent = hCert.lede || '';
    const hAwards = heading(sh, 'awards', {eyebrow:'Recognition', title:'Awards'});
    el('awardsEyebrow').textContent = hAwards.eyebrow;
    el('awardsTitle').textContent = hAwards.title;
    const hLeadership = heading(sh, 'leadership', {eyebrow:'Involvement', title:'Leadership'});
    el('leadershipEyebrow').textContent = hLeadership.eyebrow;
    el('leadershipTitle').textContent = hLeadership.title;
    const hContact = heading(sh, 'contact', {eyebrow:'Get In Touch', title:'Contact'});
    el('contactEyebrow').textContent = hContact.eyebrow;
    el('contactTitle').textContent = hContact.title;

    // About
    const a = data.about || {};
    el('aboutText').innerHTML = (a.paragraphs || []).map(p => `<p>${p}</p>`).join('') +
      (a.quote ? `<div class="quote-block">${a.quote}</div>` : '');
    el('aboutPhoto').innerHTML = imgBlock(a.photo, h.name, 'ph-placeholder', 'About photo', 'Add a photo from the admin page');
    el('aboutInterests').innerHTML = (a.interests || []).map(t => `<span class="tag">${t}</span>`).join('');
    el('aboutLanguages').innerHTML = (a.languages || []).map(l => `<div><div class="v">${l.name}</div><div class="sub">${l.level}</div></div>`).join('');

    // Education
    el('eduList').innerHTML = (data.education || []).map(e => `
      <div class="edu-card">
        <div>
          <div class="main">${e.degree || ''}</div>
          <div class="sub">${e.institution || ''}</div>
        </div>
        <div class="meta">${e.score || ''}<span class="period">${e.period || ''}</span></div>
      </div>`).join('');

    // Research
    const r = data.research || {};
    el('researchLede').textContent = r.lede || '';
    if(r.title || (r.bullets && r.bullets.length) || r.institution || r.supervisor || r.duration){
      el('researchAbstract').innerHTML = `
        <h3>${r.title || ''}</h3>
        ${(r.bullets && r.bullets.length) ? `<ul>${r.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
        <div class="meta-row">
          ${r.institution ? `<div><span class="k">Institution</span><span class="v">${r.institution}</span></div>` : ''}
          ${r.supervisor ? `<div><span class="k">Supervisor</span><span class="v">${r.supervisor}</span></div>` : ''}
          ${r.duration ? `<div><span class="k">Duration</span><span class="v">${r.duration}</span></div>` : ''}
        </div>`;
    }
    el('researchGallery').innerHTML = (r.images || []).map(img => `
      <div class="g-item">${imgBlock(img.src, img.alt, 'g-placeholder', img.label || 'Photo', 'Add a photo from the admin page')}</div>`).join('');
    el('researchCaption').textContent = r.caption || '';

    // Experience
    const ex = data.experience || {};
    el('expLede').textContent = ex.lede || '';
    const main = ex.main || {};
    if(main.site){
      el('expMain').innerHTML = `
        <div class="head">
          <span class="site">${main.site}</span>
          <span class="date">${main.date || ''}</span>
        </div>
        ${main.position ? `<span class="pos">${main.position}</span>` : ''}
        ${(main.bullets && main.bullets.length) ? `<ul>${main.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
        <div class="gallery-2">${(main.images || []).map(img => `<div class="g-item">${imgBlock(img.src, img.alt, 'g-placeholder', img.label || 'Photo', 'Add a photo from the admin page')}</div>`).join('')}</div>
        ${main.caption ? `<div class="gallery-caption">${main.caption}</div>` : ''}`;
    }
    el('expVisits').innerHTML = (ex.visits || []).map(v => `
      <div class="visit-card">
        <span class="site">${v.site || ''}</span>
        <span class="date">${v.date || ''}</span>
        <p>${v.desc || ''}</p>
        <div class="gallery-2">${(v.images || []).map(img => `<div class="g-item">${imgBlock(img.src, img.alt, 'g-placeholder', img.label || 'Photo', 'Add a photo from the admin page')}</div>`).join('')}</div>
      </div>`).join('');

    // Skills
    el('skillGroups').innerHTML = (data.skills || []).map(g => `
      <div class="skill-group">
        <h3>${g.group || ''}</h3>
        <div class="tag-list">${(g.items || []).map(i => `<span class="tag">${i}</span>`).join('')}</div>
      </div>`).join('');

    // Projects
    el('projGrid').innerHTML = (data.projects || []).map(p => `
      <div class="proj-card">
        <div class="proj-render">${imgBlock(p.image, p.title, '', p.label || 'Project render', 'Add a photo from the admin page')}</div>
        <div class="proj-body">
          ${p.tag ? `<span class="proj-tag">${p.tag}</span>` : ''}
          <h3>${p.title || ''}</h3>
          ${(p.bullets && p.bullets.length) ? `<ul>${p.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
        </div>
      </div>`).join('');

    // Certificates
    el('certGrid').innerHTML = (data.certificates || []).map(c => `
      <div class="cert-tile">
        <div class="img-slot">${imgBlock(c.image, c.title, '', 'Certificate', 'Add a photo from the admin page')}</div>
        <div class="cap"><div class="title">${c.title || ''}</div><div class="issuer">${c.issuer || ''}</div></div>
      </div>`).join('');

    // Awards / Leadership
    el('awardsList').innerHTML = (data.awards || []).map(aw => `
      <li><span class="mark">${aw.year || ''}</span><span class="txt"><strong>${aw.title || ''}</strong>${aw.desc ? `<span>${aw.desc}</span>` : ''}</span></li>`).join('');
    el('leadershipList').innerHTML = (data.leadership || []).map(l => `
      <li><span class="mark">${l.period || ''}</span><span class="txt"><strong>${l.title || ''}</strong>${l.org ? `<span>${l.org}</span>` : ''}${l.desc ? `<span class="desc">${l.desc}</span>` : ''}</span></li>`).join('');

    // Contact
    const c = data.contact || {};
    el('contactBlurb').textContent = c.blurb || '';
    let linksHtml = '';
    if(s.email) linksHtml += `<a href="mailto:${s.email}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 6l8 7 8-7"/></svg>${s.email}</a>`;
    if(s.linkedin) linksHtml += `<a href="${s.linkedin}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>${s.linkedin.replace(/^https?:\/\//,'')}</a>`;
    if(c.address) linksHtml += `<a href="#" onclick="return false;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>${c.address}</a>`;
    el('contactLinks').innerHTML = linksHtml;
    el('footerPanel').innerHTML = (c.rows || []).map(row => `<div class="row"><span class="k">${row.k}</span><span class="v">${row.v}</span></div>`).join('');
    el('footCopyright').textContent = c.copyright || '';
    el('footTagline').textContent = c.tagline || '';

    applyVisibilityAndCustomSections(data);
    initInteractions();
  }

  function renderBlock(block){
    if(block.type === 'text'){
      return block.text ? `<p class="cb-text">${block.text}</p>` : '';
    }
    if(block.type === 'list'){
      return (block.items && block.items.length) ? `<ul class="cb-list">${block.items.map(i => `<li>${i}</li>`).join('')}</ul>` : '';
    }
    if(block.type === 'gallery'){
      return (block.images && block.images.length) ? `<div class="gallery-2">${block.images.map(img => `<div class="g-item">${imgBlock(img.src, img.alt, 'g-placeholder', img.label || 'Photo', 'Add a photo from the admin page')}</div>`).join('')}</div>` : '';
    }
    if(block.type === 'cards'){
      return (block.cards && block.cards.length) ? `<div class="cb-cards">${block.cards.map(c => `
        <div class="cb-card">
          <div class="cb-card-media">${imgBlock(c.image, c.title, '', 'Photo', 'Add a photo from the admin page')}</div>
          <div class="cb-card-body">
            ${c.title ? `<h3>${c.title}</h3>` : ''}
            ${c.subtitle ? `<div class="cb-card-sub">${c.subtitle}</div>` : ''}
            ${c.text ? `<p>${c.text}</p>` : ''}
          </div>
        </div>`).join('')}</div>` : '';
    }
    return '';
  }

  function buildCustomSection(cs){
    const section = document.createElement('section');
    section.id = cs._id;
    section.className = 'custom-section' + (cs.background ? ' has-bg dark-surface' : '');
    if(cs.background){
      section.style.backgroundColor = '#0A1424';
      section.style.backgroundImage = `linear-gradient(180deg, rgba(10,20,36,.72), rgba(10,20,36,.85)), url('${cs.background}')`;
    }
    section.innerHTML = `
      <div class="wrap">
        <div class="section-head reveal">
          ${cs.eyebrow ? `<div class="eyebrow">${cs.eyebrow}</div>` : ''}
          <h2>${cs.title || ''}</h2>
          ${cs.lede ? `<p class="section-lede">${cs.lede}</p>` : ''}
        </div>
        <div class="reveal">${(cs.blocks || []).map(renderBlock).join('')}</div>
      </div>`;
    return section;
  }

  function applyVisibilityAndCustomSections(data){
    const vis = data.sectionVisibility || {};
    const FIXED_KEYS = ['about','education','research','experience','skills','projects','certificates','activities'];
    FIXED_KEYS.forEach(key => {
      const visible = vis[key] !== false;
      const sectionEl = document.getElementById(key);
      if(sectionEl) sectionEl.style.display = visible ? '' : 'none';
      const navLi = document.querySelector('.nav-links li[data-key="' + key + '"]');
      if(navLi) navLi.style.display = visible ? '' : 'none';
    });

    const customs = data.customSections || [];
    customs.forEach((cs, idx) => { cs._id = 'custom-' + idx; });

    const anchors = ['home','about','education','research','experience','skills','projects','certificates','activities'];
    const grouped = {};
    customs.forEach(cs => {
      const key = anchors.includes(cs.placement) ? cs.placement : 'end';
      (grouped[key] = grouped[key] || []).push(cs);
    });
    anchors.forEach(key => {
      const list = grouped[key];
      if(!list) return;
      let insertPoint = document.getElementById(key);
      if(!insertPoint) return;
      list.forEach(cs => {
        const secEl = buildCustomSection(cs);
        insertPoint.after(secEl);
        insertPoint = secEl;
      });
    });
    if(grouped.end){
      const footer = document.querySelector('footer#contact');
      grouped.end.forEach(cs => {
        const secEl = buildCustomSection(cs);
        footer.parentNode.insertBefore(secEl, footer);
      });
    }

    const navContactLi = document.getElementById('navContactLi');
    customs.forEach(cs => {
      if(cs.showInNav && cs.navLabel){
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + cs._id;
        a.textContent = cs.navLabel;
        li.appendChild(a);
        navContactLi.parentNode.insertBefore(li, navContactLi);
      }
    });
  }

  function initInteractions(){
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');
    navToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open);
    });
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.setAttribute('aria-expanded', false);
    }));

    const reveals = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    reveals.forEach(el => io.observe(el));

    const sections = document.querySelectorAll('section, header.hero');
    const navA = document.querySelectorAll('.nav-links a');
    const spy = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.getAttribute('id');
          navA.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
        }
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    sections.forEach(sec => sec.id && spy.observe(sec));
  }

})();
</script>
